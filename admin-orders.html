<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Owner POS — Sri Meenakshi Foods</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f9f4ec; --paper:#ffffff; --ink:#1f140e; --maroon:#5c2413;
    --rust:#d94e1b; --leaf:#388e3c; --brass:#b8860b; --border-color:rgba(92,36,19,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Work Sans', sans-serif;}
  h1,h2,h3{font-family:'Fraunces', serif; color:var(--maroon);}
  .wrap{max-width:1200px; margin:0 auto; padding:30px 20px;}

  .gate{
    max-width:380px; margin:80px auto; background:var(--paper); border:2px dashed var(--brass);
    border-radius:16px; padding:32px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.1);
  }
  .gate input{
    width:100%; padding:11px 14px; border-radius:8px; border:1px solid #ccc; margin:14px 0; font-size:0.95rem;
  }
  .gate button{
    background:var(--rust); color:#fff; border:none; padding:11px 22px; border-radius:24px; font-weight:600; cursor:pointer; width:100%;
  }

  .top-bar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:20px;}
  
  /* Live Auto-Sync Status Indicator */
  .sync-badge{
    display:inline-flex; align-items:center; gap:6px; background:#e8f5e9; color:var(--leaf);
    padding:6px 14px; border-radius:20px; font-size:0.82rem; font-weight:700; border:1px solid #a5d6a7;
  }
  .sync-dot{width:8px; height:8px; background:var(--leaf); border-radius:50%; animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{transform:scale(0.8); opacity:0.6;} 50%{transform:scale(1.2); opacity:1;} 100%{transform:scale(0.8); opacity:0.6;}}

  /* New Order Alert Banner */
  .new-order-banner{
    display:none; background:#fff3cd; color:#856404; border:2px solid #ffeba5; border-radius:12px;
    padding:14px 20px; font-size:1rem; font-weight:700; text-align:center; margin-bottom:20px;
    animation:bounce 0.5s ease;
  }
  @keyframes bounce{0%, 100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

  /* Stats Cards */
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px;}
  .stat-card{
    background:var(--paper); border-radius:12px; padding:16px; border:1px solid var(--border-color);
    box-shadow:0 2px 8px rgba(0,0,0,0.04); text-align:center;
  }
  .stat-val{font-size:1.6rem; font-family:'Fraunces', serif; color:var(--rust); font-weight:700;}
  .stat-lbl{font-size:0.8rem; color:#666; font-weight:600; text-transform:uppercase;}

  /* Orders Table */
  table{width:100%; border-collapse:collapse; background:var(--paper); border-radius:12px; overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,0.08);}
  th, td{padding:12px 14px; text-align:left; font-size:0.88rem; border-bottom:1px solid var(--border-color);}
  th{background:var(--maroon); color:#fff; font-weight:600; text-transform:uppercase; font-size:0.75rem; letter-spacing:0.4px;}
  
  .status-tag{
    padding:3px 10px; border-radius:12px; font-size:0.75rem; font-weight:700; color:#fff; display:inline-block;
  }
  .status-Placed{background:#ef6c00;}
  .status-Preparing{background:#f57f17;}
  .status-Dispatched{background:#0288d1;}
  .status-Out{background:#7b1fa2;}
  .status-Delivered{background:var(--leaf);}

  .action-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .act-btn{
    padding:4px 8px; border-radius:6px; border:none; font-size:0.75rem; font-weight:700; cursor:pointer; color:#fff;
  }
  .btn-prep{background:#f57f17;}
  .btn-out{background:#0288d1;}
  .btn-deliv{background:var(--leaf);}

  #app{display:none;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Kitchen Owner Login</h2>
  <p style="margin-top:8px; font-size:0.85rem; color:#666;">Enter your owner admin key to manage incoming live orders.</p>
  <input type="password" id="keyInput" placeholder="Admin Key (sm-owner-2026)">
  <button onclick="loadOrders(true)">Access POS Dashboard</button>
</div>

<div class="wrap" id="app">
  <!-- New Order Notification Banner -->
  <div class="new-order-banner" id="newOrderBanner">
    🔔 NEW ORDER RECEIVED! Refreshing POS dashboard...
  </div>

  <div class="top-bar">
    <div>
      <h1>👨‍🍳 Kitchen Owner POS</h1>
      <p style="font-size:0.85rem; color:#666;">Sri Meenakshi Foods — Kasibugga Branch Live POS</p>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="sync-badge">
        <span class="sync-dot"></span> Live Auto-Sync (10s)
      </div>
      <button onclick="loadOrders(true)" style="background:var(--maroon); color:#fff; border:none; padding:9px 18px; border-radius:20px; font-weight:600; cursor:pointer;">↻ Refresh Now</button>
      <a href="index.html" style="font-size:0.85rem; font-weight:600; align-self:center;">← Store Front</a>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="statOrders">0</div>
      <div class="stat-lbl">Today's Orders</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statRevenue">₹0</div>
      <div class="stat-lbl">Today's Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statPending">0</div>
      <div class="stat-lbl">Pending Kitchen Orders</div>
    </div>
  </div>

  <div id="tableWrap"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyUEvrv3ipopo948Nskpsxjq2SQhy4lQzWn6MHEbiY_r3CSiByJACk1t8ABd_yciRWk/exec";
  let adminKey = '';
  let knownOrderIds = new Set();
  let firstLoad = true;
  let autoSyncInterval = null;

  // Web Audio Synthesizer Chime Sound Generator (No external MP3 file required)
  function playOrderChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.setValueAtTime(880, now + 0.15); // A5

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.6);
    } catch (e) {}
  }

  async function loadOrders(isManual = false) {
    if (!adminKey) {
      adminKey = document.getElementById('keyInput').value.trim();
    }
    if (!adminKey) { if (isManual) alert('Please enter the admin key.'); return; }

    try {
      const res = await fetch(`${API_URL}?action=list&today=1&key=${encodeURIComponent(adminKey)}`);
      const data = await res.json();

      if (data.error === 'unauthorized') {
        alert('Wrong admin key! Please check and try again.');
        adminKey = '';
        return;
      }

      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      const orders = data.orders || [];
      
      // Check for new incoming orders
      let hasNew = false;
      let newestOid = '';
      let newestTotal = 0;

      orders.forEach(o => {
        if (!knownOrderIds.has(o.OrderID)) {
          if (!firstLoad) {
            hasNew = true;
            newestOid = o.OrderID;
            newestTotal = o.Total;
          }
          knownOrderIds.add(o.OrderID);
        }
      });

      if (hasNew) {
        playOrderChime();
        const banner = document.getElementById('newOrderBanner');
        banner.innerHTML = `🔔 NEW ORDER RECEIVED! Order #${newestOid} (₹${newestTotal})`;
        banner.style.display = 'block';
        setTimeout(() => banner.style.display = 'none', 8000);
      }

      firstLoad = false;
      renderAdminTable(orders);

      if (!autoSyncInterval) {
        autoSyncInterval = setInterval(() => loadOrders(false), 10000); // 10s auto-refresh
      }
    } catch (err) {
      if (isManual) alert('Could not reach backend system.');
    }
  }

  function renderAdminTable(orders) {
    let revenue = 0;
    let pending = 0;

    orders.forEach(o => {
      revenue += Number(o.Total || 0);
      if (o.Status !== 'Delivered') pending++;
    });

    document.getElementById('statOrders').textContent = orders.length;
    document.getElementById('statRevenue').textContent = `₹${revenue}`;
    document.getElementById('statPending').textContent = pending;

    const wrap = document.getElementById('tableWrap');
    if (orders.length === 0) {
      wrap.innerHTML = '<div style="text-align:center; padding:40px; background:#fff; border-radius:12px; color:#888;">No orders placed today yet.</div>';
      return;
    }

    let html = `<table><thead><tr>
      <th>Order ID</th><th>Time</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Status</th><th>Update Action</th>
    </tr></thead><tbody>`;

    orders.forEach(o => {
      const st = o.Status || 'Placed';
      const stCls = st.includes('Out') ? 'status-Out' : `status-${st}`;

      html += `<tr>
        <td><strong>${o.OrderID}</strong></td>
        <td style="font-size:0.78rem;">${o.OrderDate}</td>
        <td>${o.CustomerName}</td>
        <td><a href="tel:${o.Phone}" style="color:var(--rust); font-weight:600;">${o.Phone}</a></td>
        <td style="max-width:180px; font-size:0.8rem;">${o.Address || 'N/A'}</td>
        <td style="max-width:200px; font-size:0.82rem;">${o.Items}</td>
        <td style="font-weight:700; color:var(--rust);">₹${o.Total}</td>
        <td><span class="status-tag ${stCls}">${st}</span></td>
        <td>
          <div class="action-btns">
            <button class="act-btn btn-prep" onclick="updateOrderStatus('${o.OrderID}', 'Preparing')">Preparing 🍳</button>
            <button class="act-btn btn-out" onclick="updateOrderStatus('${o.OrderID}', 'Out for Delivery')">On the Way 🛵</button>
            <button class="act-btn btn-deliv" onclick="updateOrderStatus('${o.OrderID}', 'Delivered')">Delivered 🎉</button>
          </div>
        </td>
      </tr>`;
    });

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  async function updateOrderStatus(orderId, newStatus) {
    try {
      const res = await fetch(`${API_URL}?action=updateStatus&key=${encodeURIComponent(adminKey)}&orderId=${encodeURIComponent(orderId)}&status=${encodeURIComponent(newStatus)}`);
      const data = await res.json();

      if (data.success) {
        loadOrders(false);
      } else {
        alert('Failed to update order status: ' + data.error);
      }
    } catch (err) {
      alert('Error updating status.');
    }
  }
</script>
</body>
</html>
